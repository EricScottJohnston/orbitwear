[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitwear"
version = "0.0.1"
description = "Open-source prediction of how materials hold up in low Earth orbit: molecule to structure in one pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Eric Johnston" }]
keywords = ["low earth orbit", "atomic oxygen", "rarefied flow", "DSMC", "erosion", "finite element", "spacecraft materials"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/EricScottJohnston/orbitwear"
Issues = "https://github.com/EricScottJohnston/orbitwear/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
