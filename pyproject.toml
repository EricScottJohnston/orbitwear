[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitwear"
version = "1.0.0"
description = "Low Earth orbit material durability simulator: OpenFOAM rarefied flow, atomic oxygen erosion and CalculiX structure in one pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Eric Johnston" }]
keywords = ["low earth orbit", "atomic oxygen", "rarefied flow", "DSMC", "OpenFOAM", "dsmcFoam", "CalculiX", "erosion", "finite element", "spacecraft materials"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
orbitwear = "orbitwear.cli:main"

[project.urls]
Homepage = "https://github.com/EricScottJohnston/orbitwear"
Issues = "https://github.com/EricScottJohnston/orbitwear/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
